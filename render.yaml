# New SaaS frontend only. Does not change the existing GitHub Pages application.
services:
  - type: web
    name: control-creditos-joyerias
    runtime: static
    repo: https://github.com/Nixonjbc/kristall-joyas
    branch: saas/online-v2
    buildCommand: node --check saas/online.js
    staticPublishPath: ./saas
    autoDeployTrigger: "off"
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Cache-Control
        value: no-cache
